<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | LoanGuard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

    <div class="form-card">
        
        <div class="logo-icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2 class="admin-title">Admin Portal</h2>

        {% if error %}
            <div class="error-alert">
                {{ error }}
            </div>
        {% endif %}

        <form action="/admin-login" method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required class="form-input">
            </div>

            <div class="input-group last-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required class="form-input">
            </div>

            <button type="submit" class="btn-primary">
                Login <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
        
        <p class="back-link-wrapper">
            <a href="/" class="back-link">← Back to Home</a>
        </p>
    </div>

</body>
</html>
